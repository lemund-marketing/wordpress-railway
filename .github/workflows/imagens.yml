name: imagens

# Build das imagens + teste de fumaça de ponta a ponta. Só publica no GHCR se o teste passar nas duas versões de PHP.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagens-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/lemund-marketing
  FONTE: https://github.com/${{ github.repository }}

jobs:
  teste:
    name: teste de fumaça (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build mariadb-railway 11.8
        uses: docker/build-push-action@v6
        with:
          context: mariadb
          platforms: linux/amd64
          build-args: MARIADB_VERSION=11.8
          tags: mariadb-railway:teste
          load: true
          provenance: false
          cache-from: type=gha,scope=mariadb-11.8
          cache-to: ${{ matrix.php == '8.3' && 'type=gha,mode=max,scope=mariadb-11.8' || '' }}

      - name: build wordpress-railway php${{ matrix.php }}
        uses: docker/build-push-action@v6
        with:
          context: wordpress
          platforms: linux/amd64
          build-args: PHP_VERSION=${{ matrix.php }}
          tags: wordpress-railway:teste
          load: true
          provenance: false
          cache-from: type=gha,scope=wp-php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=wp-php${{ matrix.php }}

      - name: teste de fumaça
        env:
          WP_IMAGE: wordpress-railway:teste
          DB_IMAGE: mariadb-railway:teste
        run: bash teste/fumaca.sh

  publicar:
    name: publicar no GHCR
    needs: teste
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: identificação
        id: id
        run: |
          echo "curto=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "data=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: publicar wordpress-railway:php8.3
        uses: docker/build-push-action@v6
        with:
          context: wordpress
          platforms: linux/amd64
          build-args: PHP_VERSION=8.3
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRO }}/wordpress-railway:php8.3
            ${{ env.REGISTRO }}/wordpress-railway:php8.3-${{ steps.id.outputs.curto }}
          labels: |
            org.opencontainers.image.source=${{ env.FONTE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.id.outputs.data }}
            org.opencontainers.image.title=wordpress-railway php8.3
          cache-from: type=gha,scope=wp-php8.3

      - name: publicar wordpress-railway:php8.2
        uses: docker/build-push-action@v6
        with:
          context: wordpress
          platforms: linux/amd64
          build-args: PHP_VERSION=8.2
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRO }}/wordpress-railway:php8.2
            ${{ env.REGISTRO }}/wordpress-railway:php8.2-${{ steps.id.outputs.curto }}
          labels: |
            org.opencontainers.image.source=${{ env.FONTE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.id.outputs.data }}
            org.opencontainers.image.title=wordpress-railway php8.2
          cache-from: type=gha,scope=wp-php8.2

      - name: publicar mariadb-railway:11.8
        uses: docker/build-push-action@v6
        with:
          context: mariadb
          platforms: linux/amd64
          build-args: MARIADB_VERSION=11.8
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRO }}/mariadb-railway:11.8
            ${{ env.REGISTRO }}/mariadb-railway:11.8-${{ steps.id.outputs.curto }}
          labels: |
            org.opencontainers.image.source=${{ env.FONTE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.id.outputs.data }}
            org.opencontainers.image.title=mariadb-railway 11.8
          cache-from: type=gha,scope=mariadb-11.8

      - name: resumo
        run: |
          {
            echo "### Imagens publicadas"
            for i in wordpress-railway:php8.3 wordpress-railway:php8.2 mariadb-railway:11.8; do
              echo "- \`${REGISTRO}/$i\` (também \`$i-${{ steps.id.outputs.curto }}\`)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
