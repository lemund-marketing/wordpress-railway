name: alcance

# Testa, a partir de um runner do GitHub (fora da nossa rede), se uma URL protegida por HTTP Basic Auth é alcançável:
# passa só se a resposta for 401 vinda da ORIGEM (sem cf-mitigated e sem página de desafio da Cloudflare).
# A URL não aparece no log (fica mascarada; só o host é mostrado).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL a testar (sem usuário/senha), ex.: https://exemplo.com.br/pasta/teste.txt"
        required: true
        type: string

permissions:
  contents: read

jobs:
  alcance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: testar a URL
        shell: bash
        run: |
          set -euo pipefail
          # lida do evento (e não de env/expressão) para não aparecer no log antes de ser mascarada
          url="$(jq -r '.inputs.url // empty' "$GITHUB_EVENT_PATH")"
          [ -n "$url" ] || { echo "informe a url"; exit 1; }
          echo "::add-mask::$url"
          resto="${url#*://}"; resto="${resto##*@}"; host="${resto%%/*}"; caminho="${resto#"$host"}"
          if [ -n "${caminho#/}" ]; then echo "::add-mask::${caminho#/}"; fi
          case "$url" in https://*|http://*) ;; *) echo "a URL precisa começar com https://"; exit 1 ;; esac
          echo "alvo: host ${host} (caminho mascarado)"

          status="$(curl -sS -I --max-time 30 -o cab.txt -w '%{http_code}' "$url" || true)"
          valor() { grep -i "^$1:" cab.txt | head -n 1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//' || true; }
          server="$(valor server)"; ray="$(valor cf-ray)"; mit="$(valor cf-mitigated)"; auth="$(valor www-authenticate)"
          echo "status:           ${status:-sem resposta}"
          echo "server:           ${server:--}"
          echo "cf-ray:           ${ray:--}"
          echo "cf-mitigated:     ${mit:--}"
          echo "www-authenticate: ${auth:--}"

          # GET sem senha: a página de desafio da Cloudflare (403/503 com JS) não pode aparecer
          get_status="$(curl -sS --max-time 30 -o corpo.html -w '%{http_code}' "$url" || true)"
          desafio=nao
          if grep -qiE 'cf-chl|challenge-platform|cf_chl_opt|Just a moment|Attention Required' corpo.html 2>/dev/null; then desafio=sim; fi
          echo "GET sem senha:    ${get_status:-sem resposta} (página de desafio da Cloudflare: $desafio)"

          {
            echo "### alcance"
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| host | ${host} |"
            echo "| status (HEAD) | ${status:-sem resposta} |"
            echo "| server | ${server:--} |"
            echo "| cf-ray | ${ray:--} |"
            echo "| cf-mitigated | ${mit:--} |"
            echo "| www-authenticate | ${auth:--} |"
            echo "| GET sem senha | ${get_status:-sem resposta} (desafio: $desafio) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" = 401 ] && [ -z "$mit" ] && [ "$desafio" = nao ]; then
            echo "OK: 401 da origem (o runner alcança a pasta e a senha é exigida)"
          else
            echo "FALHOU: esperado 401 da origem, sem cf-mitigated e sem desafio da Cloudflare"
            exit 1
          fi
