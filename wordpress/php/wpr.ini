; PHP equivalente ao seletor de PHP de hospedagem compartilhada (alt-php 8.2/8.3), com limites realistas para contêiner.
memory_limit        = 512M
upload_max_filesize = 512M
post_max_size       = 512M
max_execution_time  = 480
max_input_time      = 480
max_input_vars      = 5000
date.timezone       = UTC
allow_url_fopen     = On
display_errors      = Off
log_errors          = On
error_log           = /dev/stderr
expose_php          = Off
realpath_cache_size = 4096K
realpath_cache_ttl  = 600
; Aqui não há MTA: e-mail sai por SMTP (mu-plugin railway-smtp.php, variáveis SMTP_*)
sendmail_path       = /bin/false

[opcache]
opcache.enable                  = 1
opcache.memory_consumption      = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files   = 60000
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = 2
